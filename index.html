<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="server monitor, Komari Monitor, server uptime monitoring, real-time server status, server performance dashboard, monitoring tool" />
    <meta name="theme-color" content="#050605" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Komari Monitor" />
    <meta property="og:title" content="Komari Monitor" />
    <meta property="og:description" content="A simple server monitor tool." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Komari Monitor" />
    <meta name="twitter:description" content="A simple server monitor tool." />
    <title>Komari ASCII</title>
    <!-- 终端字体 IBM Plex Mono：异步加载不阻塞首屏，加载完成前用系统等宽字体兜底 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
    </noscript>
    <meta name="description" content="A simple server monitor tool." />
  </head>
  <body style="background: #050605">
    <!-- ASCII 主题：首屏即黑底绿字，避免旧主题（奶油底/壁纸）在 JS 加载前闪现 -->
    <style>
      .ascii-boot {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050605;
        color: #22c55e;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas,
          "Liberation Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      .ascii-boot span {
        animation: ascii-blink 1.1s steps(2, start) infinite;
      }
      @keyframes ascii-blink {
        to {
          visibility: hidden;
        }
      }
    </style>
    <div id="root" class="relative z-30">
      <div class="ascii-boot"><span>&gt; booting komari-ascii_</span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
